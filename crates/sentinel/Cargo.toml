[package]
name = "sentinel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "sentinel"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
dirs = "5"
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls"] }
sha2 = "0.10"

[features]
default = []
# Windows/Kerberos auth for the monitoring daemon (GSSAPI on Linux). Off by
# default because it pulls system Kerberos libs that aren't present everywhere;
# build with `--features integrated-auth` in domain-auth environments.
integrated-auth = ["tiberius/integrated-auth-gssapi"]

[[bin]]
name = "dbopt-sentinel"
path = "src/bin/sentinel_cli.rs"
