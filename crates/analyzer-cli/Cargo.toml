[package]
name = "dbopt"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Find and fix slow SQL offline. A local-first database performance analyzer that lints queries and execution plans with 102 rules — no database connection required. SQL Server today."
repository.workspace = true
readme = "README.md"
keywords = ["sql", "database", "performance", "linter", "sarif"]
categories = ["command-line-utilities", "database", "development-tools"]

[[bin]]
name = "dbopt"
path = "src/main.rs"

[dependencies]
analyzer-core = { package = "dbopt-core", path = "../analyzer-core", version = "0.4.2" }
serde_json = { workspace = true }
anyhow = { workspace = true }
walkdir = "2"
