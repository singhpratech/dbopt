[workspace]
resolver = "2"
members = [
    "crates/analyzer-core",
    "crates/analyzer-wasm",
    "crates/analyzer-cli",
    "crates/backend",
    "crates/eval",
    "crates/sentinel",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/singhpratech/dbopt"
authors = ["dbopt"]
description = "Local-first database performance optimizer"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.36", features = ["serialize"] }
regex = "1"
once_cell = "1"
thiserror = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
